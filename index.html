<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Nettoyage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Calendario-->
    <h1>Planning Nettoyage</h1>

    <div class="actions"> 
        <button id="add-client-button">👤 Ajouter un client</button>
        <button id="add-employee-button">👩 Ajouter une employée</button> 
    </div>
    <div class="calendrier" id="calendrier">
        <div class="jour">
            <div class="date">3 mai</div>
        </div>

        <div class="jour">
            <div class="date">4 mai</div>
        </div>

        <div class="jour">
            <div class="date">5 mai</div>
        </div>
    </div>

<section class="heures-employees">
    <h2>Heures des employées</h2>
    <div id="compteur-heures"></div>
</section>

    <!-- Modal agendamento-->
    <div class="modal hidden" id="modal-rendezvous">
        <div class="modal-content">

             <button class="close-modal" type="button">×</button>

            <h2>Nouveau rendez-vous</h2>

            <div class="champ">
                <label>Client</label>
                <select id="client">
                    <option>Marie Dupont</option>
                    <option>Claire Martin</option>
                </select>
            </div>

            <div class="champ">
                <label>Heure</label>
                <input type="time" id="heure">
            </div>

            <div class="champ">
                <label>Durée (h)</label>
                <input type="number" id="duree" min="1" max="12">
            </div>

            <div class="champ">
                <label>Employée</label>
                <select id="employe">
                    <option value="#A855F7">Sophie</option>
                    <option value="#EF4444">Emma</option>
                </select>
            </div>

            <div class="champ">
                <label>Observations</label>
                <textarea id="obs"></textarea>
            </div>

            <button id="save">Ajouter au calendrier</button>

        </div>
    </div>

<!-- Modal client -->
<div class="modal hidden" id="client-modal">
    <div class="modal-content">

        <button class="close-modal" type="button">×</button>

        <h2>Nouveau client</h2>

        <div class="champ">
            <label>Nom</label>
            <input type="text" id="client-name">
        </div>

        <div class="champ">
            <label>Téléphone</label>
            <input type="text" id="client-phone">
        </div>

        <div class="champ">
            <label>Email</label>
            <input type="email" id="client-email">
        </div>

        <div class="champ">
            <label>Adresse</label>
            <input type="text" id="client-address">
        </div>

        <div class="champ">
            <label>Informations importantes</label>
            <textarea id="client-information"></textarea>
        </div>

        <button id="save-client-button">Enregistrer le client</button>

    </div>
</div>
     
<!-- Modal employée --> 
 <div class="modal hidden" id="modal-employe"> 
    <div class="modal-content"> 
        
        <button class="close-modal" type="button">×</button> 
        
        <h2>Nouvelle employée</h2> 
        
        <div class="champ"> 
            <label>Nom</label> 
            <input type="text" id="employe-nom"> 
        </div> 
            
        <div class="champ"> 
            <label>Adresse</label> 
            <input type="text" id="employe-adresse"> 
        </div> 
        
        <div class="champ"> 
            <label>Téléphone</label> 
            <input type="text" id="employe-tel"> 
        </div> 
        
        <div class="champ"> 
            <label>Email</label> 
            <input type="email" id="employe-email"> 
        </div> 
        
        <div class="champ"> 
            <label>Valeur par heure (€)</label> 
            <input type="number" id="employe-tarif" step="0.5" min="0"> 
        </div> 
        
        <div class="champ"> 
            <label>Couleur du calendrier</label> 
            <input type="color" id="employe-couleur" value="#A855F7"> 
        </div> 
        
        <div class="champ"> 
            <label>Disponibilité</label> 
            <table class="dispo-table"> 
                <tr> 
                    <th>Jour</th> 
                    <th>Matin</th> 
                    <th>Après-midi</th> 
                    <th>Soir</th> 
                </tr> 
                
                <tr> 
                    <td>Lun</td> 
                    <td><input type="checkbox" id="lun-matin"></td> 
                    <td><input type="checkbox" id="lun-apres"></td> 
                    <td><input type="checkbox" id="lun-soir"></td> 
                </tr> 
                
                <tr> 
                    <td>Mar</td> 
                    <td><input type="checkbox" id="mar-matin"></td> 
                    <td><input type="checkbox" id="mar-apres"></td> 
                    <td><input type="checkbox" id="mar-soir"></td> 
                </tr> 
                
                <tr> 
                    <td>Mer</td> 
                    <td><input type="checkbox" id="mer-matin"></td> 
                    <td><input type="checkbox" id="mer-apres"></td> 
                    <td><input type="checkbox" id="mer-soir"></td> 
                </tr> 
                
                <tr> 
                    <td>Jeu</td> 
                    <td><input type="checkbox" id="jeu-matin"></td> 
                    <td><input type="checkbox" id="jeu-apres"></td> 
                    <td><input type="checkbox" id="jeu-soir"></td> 
                </tr> 
                
                <tr> 
                    <td>Ven</td> 
                    <td><input type="checkbox" id="ven-matin"></td> 
                    <td><input type="checkbox" id="ven-apres"></td> 
                    <td><input type="checkbox" id="ven-soir"></td> 
                </tr> 
                
                <tr> 
                    <td>Sam</td> 
                    <td><input type="checkbox" id="sam-matin"></td> 
                    <td><input type="checkbox" id="sam-apres"></td> 
                    <td><input type="checkbox" id="sam-soir"></td> 
                </tr> 
            </table> 
        </div>
        
        <button id="save-employe">Enregistrer l'employée</button> 
    </div> 
</div>

<!-- Modal de conflito -->
<div class="modal hidden" id="modal-conflit">
    <div class="modal-content">

        <button class="close-modal" type="button">×</button>

        <h2>⚠️ Conflit d'horaire</h2>

        <div id="conflit-info"></div>

        <div class="conflit-actions">
            <button id="conflit-remplacer">
                Remplacer le rendez-vous
            </button>

            <button id="conflit-conserver">
                Conserver le rendez-vous
            </button>

            <button id="conflit-gerer">
                Gérer l'ancien rendez-vous
            </button>
        </div>

    </div>
</div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
